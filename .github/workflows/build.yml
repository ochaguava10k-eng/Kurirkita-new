name: Buat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Buka ZIP dan Build
        run: |
          unzip -o "KurirKita (1).zip"
          cd KurirKita
          echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { compilerOptions { freeCompilerArgs.add("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api") } }' >> app/build.gradle.kts
          python3 << 'PY'
          import pathlib, re
          for p in pathlib.Path('app/src').rglob('NavGraph.kt'):
              t = p.read_text()
              # 1. Balikin fungsi Modifier.padding yang ke-ganti tadi
              t = t.replace('Modifier.paddingValues(', 'Modifier.padding(')
              t = t.replace('.paddingValues(', '.padding(')
              # 2. Samain nama variabel jadi paddingValues
              t = t.replace('padding ->', 'paddingValues ->')
              t = re.sub(r'\(\s*padding\s*\)', '(paddingValues)', t)
              # 3. Kalau Scaffold-nya bolong (nggak ada ->), tambahin
              out = ""
              i = 0
              while True:
                  j = t.find('Scaffold', i)
                  if j == -1:
                      out += t[i:]
                      break
                  k = t.find('{', j)
                  if k == -1:
                      out += t[i:]
                      break
                  out += t[i:k+1]
                  after = t[k+1:k+60]
                  if '->' not in after.split('\n')[0] and 'paddingValues' in t[k:k+500]:
                      out += ' paddingValues -> '
                  i = k+1
              t = out
              p.write_text(t)
              print('FIXED TOTAL', p)
          PY
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
