name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o "KurirKita (1).zip" -d project
          ls -R project | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          cd project
          find . -name "gradlew" -exec chmod +x {} \;
          ./gradlew assembleDebug || ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KurirKita-APK
          path: "**/build/outputs/apk/debug/*.apk
