name: Buat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Buka ZIP dan Build
        run: |
          unzip -o "KurirKita (1).zip"
          ls -R | head -n 100
          APP_DIR=$(find . -maxdepth 3 -name "gradlew" | head -n 1 | xargs dirname)
          echo "APP_DIR=$APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
