name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          unzip -o "*.zip" -d project
          ls -R project | head -n 100

      - name: FixNavGraph
        run: |
          cat > project/KurirKita/app/src/main/java/com/kurirkita/app/ui/navigation/NavGraph.kt << 'EOF'
          package com.kurirkita.app.ui.navigation

          import androidx.compose.runtime.Composable
          import androidx.navigation.NavHostController
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import com.kurirkita.app.ui.screens.DashboardScreen
          import com.kurirkita.app.ui.screens.LoginScreen
          import com.kurirkita.app.ui.screens.OrderDetailScreen
          import com.kurirkita.app.ui.screens.OrdersScreen
          import com.kurirkita.app.ui.screens.ProfileScreen
          import com.kurirkita.app.ui.screens.RegisterScreen
          import com.kurirkita.app.ui.screens.WalletScreen

          @Composable
          fun NavGraph(navController: NavHostController, startDestination: String = Routes.LOGIN) {
              NavHost(navController = navController, startDestination = startDestination) {
                  composable(Routes.LOGIN) { LoginScreen(navController) }
                  composable(Routes.REGISTER) { RegisterScreen(navController) }
                  composable(Routes.DASHBOARD) { DashboardScreen(navController) }
                  composable(Routes.ORDERS) { OrdersScreen(navController) }
                  composable(Routes.ORDER_DETAIL) { OrderDetailScreen(navController) }
                  composable(Routes.WALLET) { WalletScreen() }
                  composable(Routes.PROFILE) { ProfileScreen(navController) }
              }
          }
          EOF

      - name: Fix Experimental API
        run: |
          cd project/KurirKita
          echo 'kotlinOptions { freeCompilerArgs += "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api" }' >>
      - name: Build APK
        run: |
                cd project/KurirKita
                gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/KurirKita/app/build/outputs/apk/debug/app-debug.apk
