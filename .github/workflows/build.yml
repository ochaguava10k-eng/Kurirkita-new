name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o "KurirKita (1).zip" -d project
          ls project/KurirKita
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Liat NavGraph
        run: |
          cat project/KurirKita/app/src/main/java/com/kurirkita/app/ui/navigation/NavGraph.kt
      - name: Build APK
        run: |
          cd project/KurirKita
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KurirKita-APK
          path: "**/build/outputs/apk/debug/*.apk"
