name: Buat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Buka ZIP dan Build
        run: |
          unzip -o "KurirKita (1).zip"
          cd KurirKita
          echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { compilerOptions { freeCompilerArgs.add("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api") } }' >> app/build.gradle.kts
          python3 << 'PY'
          import pathlib, re
          for p in pathlib.Path('app/src').rglob('NavGraph.kt'):
              t = p.read_text()
              # Buang semua lambda padding
              t = t.replace('paddingValues ->', '')
              t = t.replace('padding ->', '')
              # Buang semua Modifier.padding(...)
              t = re.sub(r'Modifier\.padding\([^)]*\)', 'Modifier', t)
              t = re.sub(r'\.padding\([^)]*\)', '', t)
              # Bersihin sisa kata padding yang nyangkut
              t = re.sub(r'\(paddingValues\)', '()', t)
              t = re.sub(r'\(padding\)', '()', t)
              p.write_text(t)
              print('STRIPPED', p)
          PY
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
